workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $BDD_MANUAL_RUN == "1"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $BDD_MANUAL_RUN == "1"'
    - when: never

stages:
  - bdd

bdd-web-ui:
  stage: bdd
  image: mcr.microsoft.com/playwright:v1.50.0-jammy
  timeout: 30m
  variables:
    DEBIAN_FRONTEND: noninteractive
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
  cache:
    key: bdd-python-v1
    paths:
      - .cache/pip
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends cmake curl g++ ninja-build python3-venv
    - python3 -m venv .bdd-venv
    - .bdd-venv/bin/pip install --disable-pip-version-check pytest==8.3.5 pytest-bdd==8.1.0 playwright==1.50.0 pytest-playwright==0.7.0 requests==2.32.3 numpy==2.2.3 gguf==0.19.0
  script:
    - cmake -S . -B build-bdd -G Ninja -DGGML_NATIVE=OFF -DGGML_IQK_FLASH_ATTENTION=ON -DGGML_IQK_FA_ALL_QUANTS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_CURL=OFF
    - cmake --build build-bdd --target llama-server --parallel "$(nproc)"
    - mkdir -p "$CI_PROJECT_DIR/.bdd-model"
    - curl --fail --location --output "$CI_PROJECT_DIR/.bdd-model/stories260K.gguf" "https://huggingface.co/ggml-org/tiny-llamas/resolve/def3e2dd70df35ecbf6403ea347de4c5977220c1/stories260K.gguf"
    - echo "047bf46455a544931cff6fef14d7910154c56afbc23ab1c5e56a72e69912c04b  $CI_PROJECT_DIR/.bdd-model/stories260K.gguf" | sha256sum --check --strict
    - PYTHONPATH="$CI_PROJECT_DIR/gguf-py" .bdd-venv/bin/python examples/stage-runner/slice_gguf_layers.py "$CI_PROJECT_DIR/.bdd-model/stories260K.gguf" "$CI_PROJECT_DIR/.bdd-model/library"
    - build-bdd/bin/llama-server --model-dir "$CI_PROJECT_DIR/.bdd-model/library" --host 127.0.0.1 --port 18080 --ctx-size 512 >tests/bdd/server.log 2>&1 &
    - echo $! > "$CI_PROJECT_DIR/.bdd-server.pid"
    - for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1:18080/health >/dev/null && break; test "$attempt" -lt 60 || { cat tests/bdd/server.log; exit 1; }; sleep 1; done
    - |
      cat > /tmp/dreamcatcher-bdd.env <<EOF
      export PATH="$CI_PROJECT_DIR/.bdd-venv/bin:\$PATH"
      export PYTHONPATH="$CI_PROJECT_DIR"
      export LLAMA_SERVER_BIN="$CI_PROJECT_DIR/build-bdd/bin/llama-server"
      export BDD_HOST="127.0.0.1"
      export BDD_PORT="18080"
      export BDD_LIB_DIR="$CI_PROJECT_DIR/.bdd-model/library"
      export BDD_MODEL="ggml-org/tiny-llamas/stories260K.gguf@def3e2dd70df35ecbf6403ea347de4c5977220c1"
      export BDD_RUNNER="GitLab Docker Runner (CPU, Playwright Chromium)"
      export BDD_TEST_TARGET="$CI_PROJECT_DIR/tests/bdd/test_web_ui.py"
      export BDD_BINARY_COMMIT="$CI_COMMIT_SHA"
      export BDD_GITHUB_COMMIT="${BDD_GITHUB_COMMIT:?Set BDD_GITHUB_COMMIT to the equivalent Dreamcatcher commit}"
      export PLAYWRIGHT_BROWSERS_PATH="/ms-playwright"
      EOF
    - tests/bdd/run-local.sh /tmp/dreamcatcher-bdd.env
  after_script:
    - test ! -f "$CI_PROJECT_DIR/.bdd-server.pid" || kill "$(cat "$CI_PROJECT_DIR/.bdd-server.pid")" 2>/dev/null || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - tests/bdd/report.xml
      - tests/bdd/RESULTS.md
      - tests/bdd/server.log
    reports:
      junit: tests/bdd/report.xml

# D6 (@d6 @ci, tests/bdd/features/inkling.feature): the synthetic-GGUF fixture
# smoke — proves the Inkling arch (D1) loads and its graph (D2) runs on CPU.
# No GPU, no model download, no oracle: tools/make-inkling-test-gguf.py writes
# the ~19 MB fixture in-step. Same image, cache and venv as bdd-web-ui so the
# runner needs nothing new; only llama-perplexity and llama-cli are built
# (-DGGML_CUDA=OFF, no server). The scenario keeps its @pending tag until this
# job has run green in a pipeline.
bdd-inkling-fixture:
  stage: bdd
  image: mcr.microsoft.com/playwright:v1.50.0-jammy
  timeout: 30m
  variables:
    DEBIAN_FRONTEND: noninteractive
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    CUDA_VISIBLE_DEVICES: ""
  cache:
    key: bdd-python-v1
    paths:
      - .cache/pip
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends cmake g++ ninja-build python3-venv
    - python3 -m venv .bdd-venv
    # Same pin set as bdd-web-ui: conftest imports every step module, and
    # steps/web_ui_steps.py imports playwright.sync_api at module level, so the
    # playwright package is needed even though no browser is launched here.
    - .bdd-venv/bin/pip install --disable-pip-version-check pytest==8.3.5 pytest-bdd==8.1.0 playwright==1.50.0 pytest-playwright==0.7.0 requests==2.32.3 numpy==2.2.3 gguf==0.19.0
  script:
    - cmake -S . -B build-bdd -G Ninja -DGGML_NATIVE=OFF -DGGML_CUDA=OFF -DGGML_IQK_FLASH_ATTENTION=ON -DGGML_IQK_FA_ALL_QUANTS=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_SERVER=OFF -DLLAMA_CURL=OFF
    - cmake --build build-bdd --target llama-perplexity llama-cli --parallel "$(nproc)"
    - mkdir -p "$CI_PROJECT_DIR/tests/bdd/inkling-d6"
    - |
      cat > /tmp/dreamcatcher-bdd-inkling.env <<EOF
      export PATH="$CI_PROJECT_DIR/.bdd-venv/bin:\$PATH"
      export PYTHONPATH="$CI_PROJECT_DIR"
      export LLAMA_PERPLEXITY_BIN="$CI_PROJECT_DIR/build-bdd/bin/llama-perplexity"
      export LLAMA_CLI_BIN="$CI_PROJECT_DIR/build-bdd/bin/llama-cli"
      export BDD_INKLING_D6_LOG_DIR="$CI_PROJECT_DIR/tests/bdd/inkling-d6"
      export BDD_MODEL="synthetic Inkling fixture, generated in-step by tools/make-inkling-test-gguf.py"
      export BDD_RUNNER="GitLab Docker Runner (CPU only, no GPU)"
      export BDD_TEST_TARGET="$CI_PROJECT_DIR/tests/bdd/test_inkling.py::test_inkling_d6_ci_fixture"
      export BDD_BINARY_COMMIT="$CI_COMMIT_SHA"
      export BDD_GITHUB_COMMIT="${BDD_GITHUB_COMMIT:-$CI_COMMIT_SHA}"
      export CUDA_VISIBLE_DEVICES=""
      EOF
    - tests/bdd/run-local.sh /tmp/dreamcatcher-bdd-inkling.env
    # A skipped scenario exits pytest 0. This job exists to RUN the smoke, so a
    # skip (binary or generator missing) is a job failure, not a green run.
    - |
      .bdd-venv/bin/python - <<'EOF'
      import sys
      import xml.etree.ElementTree as ET
      totals = {key: 0 for key in ("tests", "skipped", "failures", "errors")}
      for suite in ET.parse("tests/bdd/report.xml").getroot().iter("testsuite"):
          for key in totals:
              totals[key] += int(suite.get(key, 0))
      print("bdd-inkling-fixture junit totals:", totals)
      if totals["tests"] != 1 or any(totals[key] for key in ("skipped", "failures", "errors")):
          sys.exit("D6 smoke did not run to a pass: exactly one test must run, with no skip, failure or error")
      EOF
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - tests/bdd/report.xml
      - tests/bdd/RESULTS.md
      - tests/bdd/inkling-d6/
    reports:
      junit: tests/bdd/report.xml
